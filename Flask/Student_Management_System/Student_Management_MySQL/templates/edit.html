<!DOCTYPE html>
<html>

<head>
    <title>Edit Student</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .cancel {
            margin-left: 15px;
            color: red;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form action="/update/{{ student.id }}" method="POST">

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            placeholder="Student Name"
            required
        >

        <input
            type="number"
            name="age"
            value="{{ student.age }}"
            placeholder="Age"
            required
        >

        <input
            type="text"
            name="course"
            value="{{ student.course }}"
            placeholder="Course"
            required
        >

        <input
            type="number"
            step="0.1"
            name="marks"
            value="{{ student.marks }}"
            placeholder="Marks"
            required
        >

        <button type="submit">
            Update Student
        </button>

        <a href="/" class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
