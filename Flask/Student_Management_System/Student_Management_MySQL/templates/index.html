<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 180px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        a {
            text-decoration: none;
            margin: 0 5px;
        }

        .edit {
            color: blue;
        }

        .delete {
            color: red;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Student Management System</h1>


    <!-- =========================
         ADD STUDENT
         ========================= -->

    <h2>Add Student</h2>

    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >

        <input
            type="number"
            name="age"
            placeholder="Age"
            required
        >

        <input
            type="text"
            name="course"
            placeholder="Course"
            required
        >

        <input
            type="number"
            step="0.1"
            name="marks"
            placeholder="Marks"
            required
        >

        <button type="submit">
            Add Student
        </button>

    </form>


    <!-- =========================
         STUDENT LIST
         ========================= -->

    <h2>Student List</h2>

    <table>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Age</th>

            <th>Course</th>

            <th>Marks</th>

            <th>Action</th>

        </tr>


        {% for student in students %}

        <tr>

            <td>
                {{ student.id }}
            </td>

            <td>
                {{ student.name }}
            </td>

            <td>
                {{ student.age }}
            </td>

            <td>
                {{ student.course }}
            </td>

            <td>
                {{ student.marks }}
            </td>

            <td>

                <!-- EDIT -->

                <a
                    class="edit"
                    href="/edit/{{ student.id }}"
                >
                    Edit
                </a>


                <!-- DELETE -->

                <a
                    class="delete"
                    href="/delete/{{ student.id }}"
                    onclick="return confirm('Are you sure you want to delete this student?');"
                >
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>

</html>
